name: EAS Android Build

on:
  push:
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  eas-build-android:
    name: EAS Build (Android)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd mobile
          npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Show EAS auth status
        run: |
          eas whoami || echo "Not logged in (EXPO_TOKEN may be missing)"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS build (production AAB) and capture build id
        run: |
          cd mobile
          npm install -g jq || true
          BUILD_JSON=$(eas build -p android --profile production --non-interactive --wait --json)
          echo "$BUILD_JSON" > build-info.json
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.id // .buildId // .data.id')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Saved build id $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download EAS build artifact
        run: |
          cd mobile
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No build id found; skipping download"
            exit 0
          fi
          set -e
          # Try to download as AAB first, fallback to APK
          eas build:download --platform android --id "$BUILD_ID" --output artifact.aab || true
          eas build:download --platform android --id "$BUILD_ID" --output artifact.apk || true
          ls -la

      - name: Create GitHub Release and upload artifact
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          files: mobile/artifact.*

      - name: Upload to Play Store (optional)
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.PLAY_STORE_PACKAGE_NAME != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAY_STORE_PACKAGE_NAME }}
          releaseFiles: mobile/artifact.aab
