name: EAS Release - Publish to Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-playstore:
    name: Build & Publish to Play Store
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_STORE_PACKAGE_NAME: ${{ secrets.PLAY_STORE_PACKAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install dependencies
        run: |
          cd mobile
          npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS build and capture build id
        run: |
          cd mobile
          BUILD_JSON=$(eas build -p android --profile production --non-interactive --wait --json)
          echo "$BUILD_JSON" > build-info.json
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.id // .buildId // .data.id')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Saved build id $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download EAS build artifact
        run: |
          cd mobile
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No build id found; failing"
            exit 1
          fi
          eas build:download --platform android --id "$BUILD_ID" --output artifact.aab || true
          eas build:download --platform android --id "$BUILD_ID" --output artifact.apk || true
          ls -la

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAY_STORE_PACKAGE_NAME }}
          releaseFiles: mobile/artifact.aab
          track: production

      - name: Create GitHub Release (tag)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: mobile/artifact.*
